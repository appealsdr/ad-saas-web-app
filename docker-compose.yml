services:
  postgres:
    image: postgres:16-alpine
    container_name: samdoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samdoctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files in this folder are auto-applied on FIRST container start
      # (i.e. when postgres_data volume is empty). To re-apply after editing,
      # run: docker compose down -v && docker compose up -d
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samdoctor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: samdoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
